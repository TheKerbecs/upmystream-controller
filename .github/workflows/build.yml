name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/SelfCheck
      - run: dotnet build src/GameController -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: upmystream-game-controller
          path: src/GameController/bin/Release/net48/upmystream-game-controller.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/GameController/bin/Release/net48/upmystream-game-controller.exe
